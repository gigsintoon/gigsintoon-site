<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Messages – Gigs in toon</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css?v=202611130300">
  <link rel="stylesheet" href="/admin.css?v=202611130930">
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <a class="brand" href="/">Gigs in <span>toon</span></a>
      <nav class="nav"><a href="/">On this day</a><a href="/?page=favourites">Favourites</a><a href="/?page=week">This week</a><a href="/?page=stats">Stats</a><a href="/?page=guess">Guess the cover</a><a href="/about">About</a><a href="/contact">Contact</a></nav>
    </div>
    <div id="adminBar" class="adminbar" data-static></div>
  </header>
  <script src="/topbar.js?v=202611130900"></script>
  <script src="/adminbar.js?v=202611130300"></script>
  <main class="wrap">
    <h1>Messages</h1>
    <div id="mlist" class="muted">Loading…</div>
  </main>
  <script>
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    let showBin = false;
    const left = d => Math.max(0, 30 - Math.floor((Date.now() - Date.parse(d)) / 86400000));
    const card = (m, inBin) => `
        <div class="msg ${m.read ? 'read' : ''}">
          <div class="mhead"><b>${esc(m.name || 'Anonymous')}</b> ${m.email ? `&lt;<a href="mailto:${esc(m.email)}">${esc(m.email)}</a>&gt;` : ''}
            <span class="muted">· ${esc(m.topic)} · ${new Date(m.at).toLocaleString('en-GB')}</span>
            ${inBin
              ? `<span class="muted">· deleted for good in ${left(m.deletedAt)} day${left(m.deletedAt) === 1 ? '' : 's'}</span>
                 <button data-id="${esc(m.id)}" data-act="restore">Restore</button>
                 <button data-id="${esc(m.id)}" data-act="purge" class="danger">Delete forever</button>`
              : `<button data-id="${esc(m.id)}" data-read="${m.read ? 0 : 1}">${m.read ? 'Mark unread' : 'Mark read'}</button>
                 <button data-id="${esc(m.id)}" data-act="delete">Delete</button>`}</div>
          <div class="mbody">${esc(m.message)}</div></div>`;
    async function load() {
      const { messages, bin = [] } = await (await fetch('/api/manage/messages')).json();
      document.getElementById('mlist').innerHTML = (messages.length ? messages.map(m => card(m, false)).join('') : '<p>No messages.</p>')
        + `<p style="margin-top:24px"><button id="binToggle" type="button">🗑️ Deleted messages (${bin.length})</button>
           <span class="muted" style="font-size:14px"> Deleted messages are kept for 30 days, then removed automatically.</span></p>`
        + (showBin ? `<div class="bin">${bin.length ? bin.map(m => card(m, true)).join('') : '<p class="muted">The bin is empty.</p>'}</div>` : '');
    }
    const armed = new Set();
    document.addEventListener('click', async e => {
      if (e.target.id === 'binToggle') { showBin = !showBin; load(); return; }
      const b = e.target.closest('[data-id]'); if (!b) return;
      const act = b.dataset.act;
      if (act === 'purge' && !armed.has(b.dataset.id)) { armed.add(b.dataset.id); b.textContent = 'Click again – this can\'t be undone'; return; }
      const body = act ? { id: b.dataset.id, action: act } : { id: b.dataset.id, read: b.dataset.read === '1' };
      b.disabled = true;
      await fetch('/api/manage/messages', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      load();
    });
    load();
  </script>
</body>
</html>
