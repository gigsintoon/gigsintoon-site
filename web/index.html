<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gigs in toon – On This Day</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <a class="brand" href="/">Gigs in <span>toon</span></a>
      <nav class="nav">
        <a id="navDay" data-nav="dayView" href="/">On this day</a>
        <a id="navFav" data-nav="favView" href="/?page=favourites">Favourites</a>
      </nav>
      <form id="searchForm" class="search" role="search">
        <input id="searchBox" type="search" placeholder="Search bands…" autocomplete="off" aria-label="Search bands">
        <div id="searchResults" class="results" hidden></div>
      </form>
      <a id="signIn" class="signout" href="/login" hidden>Sign in</a>
    </div>
    <div id="adminBar" class="adminbar" hidden>
      <div class="wrap">
        <span>Admin</span>
        <a href="/admin">Release list</a>
        <button id="visitorToggle" type="button" class="ghost"></button>
        <a class="signout" href="/logout">Sign out</a>
      </div>
    </div>
  </header>

  <main class="wrap">
    <section id="dayView">
      <div class="daynav">
        <button id="prevDay" aria-label="Previous day">‹</button>
        <h1 id="dayTitle">On this day</h1>
        <button id="nextDay" aria-label="Next day">›</button>
        <input id="datePick" type="date" aria-label="Pick a date">
        <button id="todayBtn" class="ghost">Today</button>
      </div>
      <p id="daySummary" class="muted"></p>
      <div id="gigs"></div>
      <div id="releases" class="grid"></div>
    </section>

    <section id="bandView" hidden>
      <button id="backBtn" class="ghost">‹ Back</button>
      <h1 id="bandName"></h1>
      <p id="bandHandles" class="muted"></p>
      <div id="bandReleases" class="grid"></div>
    </section>

    <section id="favView" hidden>
      <h1>Favourite albums</h1>
      <div id="favYears" class="years"></div>
      <div id="favBody"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
