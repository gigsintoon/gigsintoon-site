<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Gigs in toon – On This Day</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <a class="brand" href="/">Gigs in <span>toon</span></a>
      <form id="searchForm" class="search" role="search">
        <input id="searchBox" type="search" placeholder="Search bands…" autocomplete="off" aria-label="Search bands">
        <div id="searchResults" class="results" hidden></div>
      </form>
      <a class="signout" href="/logout">Sign out</a>
    </div>
  </header>

  <main class="wrap">
    <section id="dayView">
      <div class="daynav">
        <button id="prevDay" aria-label="Previous day">‹</button>
        <h1 id="dayTitle">On this day</h1>
        <button id="nextDay" aria-label="Next day">›</button>
        <input id="datePick" type="date" aria-label="Pick a date">
        <button id="todayBtn" class="ghost">Today</button>
      </div>
      <p id="daySummary" class="muted"></p>
      <div id="gigs"></div>
      <div id="releases" class="grid"></div>
    </section>

    <section id="bandView" hidden>
      <button id="backBtn" class="ghost">‹ Back</button>
      <h1 id="bandName"></h1>
      <p id="bandHandles" class="muted"></p>
      <div id="bandReleases" class="grid"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
