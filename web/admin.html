<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Release list – Gigs in toon</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css?v=202611122246">
  <link rel="stylesheet" href="/admin.css?v=202611122246">
</head>
<body>
  <header class="top">
    <div class="wrap bar">
      <a class="brand" href="/">Gigs in <span>toon</span></a>
      <nav class="nav"><a href="/">On this day</a><a href="/?page=favourites">Favourites</a><a href="/?page=week">This week</a><a href="/?page=years">Years</a><a href="/?page=stats">Stats</a><a href="/?page=guess">Guess the cover</a><a href="/about">About</a><a href="/contact">Contact</a></nav>
    </div>
    <div id="adminBar" class="adminbar" data-static></div>
  </header>
  <script src="/adminbar.js?v=202611122246"></script>
  <main class="wrap">
    <div class="listhead">
      <h1>Release list</h1>
      <div id="months" class="years"></div>
    </div>
    <p class="muted help">Click a row to change its colour: none → <b class="k-orange">orange</b> → <b class="k-green">green</b> → none.
      Use the <b class="k-red">Don't post</b> button to make a row red. Changes save straight away.
      <span id="pending"></span></p>
    <div class="filters">
      <label><input type="checkbox" id="fMissing"> Only missing cover or write-up</label>
      <label><input type="checkbox" id="fHideRed"> Hide red</label>
      <input id="fText" type="search" placeholder="Filter…">
      <span id="counts" class="muted"></span>
    </div>
    <table class="rel">
      <thead><tr><th>Day</th><th>Band</th><th>Title</th><th>Year</th><th>Chart</th><th>Notes</th><th title="Cover / write-up">Has</th><th></th></tr></thead>
      <tbody id="rows"><tr><td colspan="8" class="muted">Loading…</td></tr></tbody>
    </table>
    <button id="toTop" class="totop" type="button" aria-label="Back to top" hidden>↑ Top</button>
  </main>
  <script src="/admin.js?v=202611122246"></script>
</body>
</html>
